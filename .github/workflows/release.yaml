name: Docker Plugin Publish
on:
  workflow_dispatch: null
  release:
    types: [ published ]

permissions:
  contents: read
  id-token: write

jobs:
  oci_publish:
    name: Build and publish the docker plugin
    runs-on: ubuntu-latest
    steps:
      - name: Clone Repository
        uses: actions/checkout@v7

      - name: setup python 3
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: OIDC connections
        id: docker_oidc
        uses: docker/oidc-action@v1
        with:
          connection-id: ${{ vars.DOCKER_OIDC_CONNECTION_ID }}
          expires-in: 1800

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_ORGANIZATION }}
          password: ${{ steps.docker_oidc.outputs.token }}

      - name: Build and push to DockerHub
        run: make deploy
        env:
          PLUGIN_VERSION: ${{ github.event.release.tag_name }}
